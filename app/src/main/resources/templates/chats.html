<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Engineer's Meet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

    <!-- STOMP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Engineer's Meet</h2>

    <div class="card shadow">
        <div class="card-body">

            <!-- Chat messages -->
            <div id="chatBox"
                 class="border rounded p-3 mb-3"
                 style="height:400px; overflow-y:auto; background:#f8f9fa;">
            </div>

            <!-- Username -->
            <div class="mb-3">
                <input type="text"
                       id="username"
                       class="form-control"
                       placeholder="Enter your name">
            </div>

            <!-- Message input -->
            <div class="input-group">
                <input type="text"
                       id="message"
                       class="form-control"
                       placeholder="Type your message">

                <button class="btn btn-primary"
                        type="button"
                        onclick="sendMessage()">
                    Send
                </button>
            </div>

        </div>
    </div>

</div>

<script>

    let stompClient = null;

    function connect() {

        const socket = new SockJS('/chat');

        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            console.log("Connected to server");

            stompClient.subscribe('/topic/messages', function (message) {

                showMessage(JSON.parse(message.body));

            });

        });
    }


    function showMessage(message) {

        let chatBox = document.getElementById('chatBox');

        let newMessage = document.createElement('div');

        newMessage.classList.add("mb-2");

        newMessage.textContent = message.sender + " : " + message.content;

        chatBox.appendChild(newMessage);

        chatBox.scrollTop = chatBox.scrollHeight;
    }


    function sendMessage() {

        console.log("Sending message");

        let sender = document.getElementById('username').value;

        let content = document.getElementById('message').value;

        if(sender === "" || content === "") {
            alert("Please enter name and message");
            return;
        }

        const chatMessage = {
            sender: sender,
            content: content
        };

        stompClient.send('/app/sendMessage', {}, JSON.stringify(chatMessage));

        document.getElementById('message').value = '';
    }


    window.onload = connect;

</script>

</body>
</html>
